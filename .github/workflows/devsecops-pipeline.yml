name: DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: python -m pip install semgrep

      - name: Ejecutar Análisis SAST
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --severity ERROR \
            --sarif \
            --output semgrep-results.sarif \
            --error \
            --metrics=off \
            .

      - name: Publicar reporte sarif
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif-report
          path: semgrep-results.sarif
          if-no-files-found: warn

  sca-and-sbom:
    name: SCA y generacion de SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar SBOM CycloneDX
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Publicar SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error

      - name: Preparar directorios de SCA
        run: |
          mkdir -p reports
          mkdir -p "$RUNNER_TEMP/dependency-check-data"

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        shell: bash
        run: |
          args=(
            --project "NodeGoat"
            --scan /src
            --format HTML
            --format JSON
            --out /report
            --failOnCVSS 7
            --enableExperimental
          )

          if [[ -n "$NVD_API_KEY" ]]; then
            args+=(--nvdApiKey "$NVD_API_KEY")
          fi

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$GITHUB_WORKSPACE/reports:/report" \
            -v "$RUNNER_TEMP/dependency-check-data:/usr/share/dependency-check/data" \
            owasp/dependency-check:latest \
            "${args[@]}"

      - name: Publicar reporte SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          if-no-files-found: warn
